# GitHub Pages へ静的サイトとして公開する。
#
# このアプリはサーバー処理を持たないので、`next build` の静的書き出し
# (`output: "export"`) をそのまま配信できる。プロジェクトページは
# `/pdf_edit/` の下で配信されるため、その接頭辞を渡してビルドする。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は 1 本ずつ。走行中のものは最後まで走らせる。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall で PDF.js と OCR の資材を public/ へ用意する。
      - run: npm ci

      - run: npm run build:pages

      # Jekyll に `_next/` を消されないようにする（保険）。
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
